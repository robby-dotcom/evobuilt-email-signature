<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoBuilt Signature Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PP Telegraf', Arial, Helvetica, sans-serif;
    background: #F5F2ED;
    color: #2D2D2D;
    min-height: 100vh;
  }
  .app {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 360px;
    min-width: 360px;
    background: #2D2D2D;
    color: #E8E2D8;
    padding: 28px 24px;
    overflow-y: auto;
    border-right: 3px solid #8B7355;
  }
  .sidebar h1 {
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #8B7355;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .sidebar .subtitle {
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-weight: 200;
    font-size: 12px;
    color: #999;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #C4BFAE;
  }
  .sidebar h2 {
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #8B7355;
    margin: 24px 0 12px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #6B5A42;
  }
  .sidebar label {
    display: block;
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-weight: 200;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  .sidebar input[type="text"],
  .sidebar input[type="url"],
  .sidebar input[type="email"],
  .sidebar input[type="tel"],
  .sidebar select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #C4BFAE;
    border-radius: 4px;
    background: #F5F2ED;
    color: #2D2D2D;
    font-family: 'PP Telegraf', Arial, Helvetica, sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .sidebar input:focus,
  .sidebar select:focus {
    border-color: #8B7355;
    box-shadow: 0 0 0 1px #8B7355;
  }
  .sidebar input::placeholder {
    color: #555;
  }
  .sidebar .field-row {
    display: grid;
    gap: 10px;
  }
  .btn-copy {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #8B7355;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  .btn-copy:hover {
    background: #6B5A42;
  }
  .btn-copy.copied {
    background: #2ecc71;
  }
  .main {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .main h2 {
    font-family: 'PP Telegraf', Arial, sans-serif;
    font-weight: 200;
    font-size: 16px;
    color: #666666;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .preview-container {
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    padding: 30px;
    display: inline-block;
    max-width: 760px;
    width: 100%;
  }
  .button-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .output-area {
    width: 100%;
    min-height: 240px;
    margin-top: 18px;
    padding: 12px;
    border: 1px solid #C4BFAE;
    border-radius: 8px;
    background: #f8f6f0;
    color: #333;
    font-family: Menlo, Monaco, Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre;
    overflow: auto;
  }
  .note {
    margin-top: 8px;
    color: #777;
    font-size: 12px;
    line-height: 1.5;
  }
  .preview-type {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .preview-type label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #aaa;
  }
  .preview-type input {
    width: auto;
    accent-color: #8B7355;
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>EvoBuilt</h1>
    <div class="subtitle">Signature Generator</div>

    <h2>Team member</h2>
    <label for="field-person">Select a person</label>
    <select id="field-person" onchange="handlePersonChange()">
      <option value="robby">Robby Kruyer</option>
      <option value="dean">Dean</option>
      <option value="emily">Emily</option>
      <option value="cleo">Cleo</option>
      <option value="millie">Millie O'Keeffe</option>
      <option value="spiros">Spiros</option>
      <option value="zoe">Zoe</option>
    </select>

    <label for="field-photo">Photo URL</label>
    <input type="url" id="field-photo" value="https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Robby.jpg" oninput="updatePreview()">

    <label for="field-name">Full Name</label>
    <input type="text" id="field-name" value="Robby Kruyer" oninput="updatePreview()">

    <label for="field-title">Job Title</label>
    <input type="text" id="field-title" placeholder="e.g. Director" oninput="updatePreview()">

    <label for="field-phone">Phone</label>
    <input type="tel" id="field-phone" placeholder="e.g. 0409 505 948" oninput="updatePreview()">

    <label for="field-email">Email local part</label>
    <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px;">
      <input type="text" id="field-email" placeholder="e.g. robby" oninput="updatePreview()">
      <input type="text" value="@evobuilt.com.au" readonly style="background:#e8e4db; cursor:not-allowed; color:#444;">
    </div>

    <div class="preview-type">
      <label><input type="radio" name="output-mode" value="ghl" checked onchange="updatePreview()"> Go High Level</label>
      <label><input type="radio" name="output-mode" value="gmail" onchange="updatePreview()"> Gmail</label>
    </div>

    <div class="button-row">
      <button class="btn-copy" onclick="copyHTML('ghl', event)">Copy GHL HTML</button>
      <button class="btn-copy" onclick="copyHTML('gmail', event)">Copy Gmail HTML</button>
    </div>

    <p class="note">Select a person, edit details as needed, then preview and copy the HTML for the chosen target. The code below updates automatically.</p>
  </div>

  <div class="main">
    <h2>Live Preview</h2>
    <div class="preview-container">
      <div id="signature-preview"></div>
    </div>
    <div style="width: 100%; margin-top: 24px;">
      <label for="field-html-output" style="display:block; margin-bottom:8px; color:#666; font-size:13px;">Generated HTML code (<span id="output-type-label">Go High Level</span>)</label>
      <textarea id="field-html-output" readonly class="output-area" onclick="this.select()"></textarea>
    </div>
  </div>
</div>

<script>
  const TEAM_MEMBERS = [
    { id: 'robby', label: 'Robby Kruyer', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Robby.jpg', title: 'Director and BDM', phone: '0409 505 948', emailLocal: 'robby' },
    { id: 'dean', label: 'Dean Baldwin', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Dean.jpg', title: 'Director and Construction Manager', phone: '0408 372 331', emailLocal: 'dean' },
    { id: 'emily', label: 'Emily Heber-Percy', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Emily.jpg', title: 'Office Manager', phone: '0487 080 606', emailLocal: 'emily' },
    { id: 'cleo', label: 'Cleo Gilmore', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Cleo.jpg', title: 'Executive Assistant', phone: '0494 647 640', emailLocal: 'cleo' },
    { id: 'millie', label: 'Millie O\'Keeffe', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Millie.jpg', title: 'Project Manager', phone: '0426 223 006', emailLocal: 'millie' },
    { id: 'spiros', label: 'Spiros Chasiotis', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Spiros.jpg', title: 'Commercial Operations Manager', phone: '0494 655 472', emailLocal: 'spiros' },
    { id: 'zoe', label: 'Zoe Thomas', photo: 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Zoe.jpg', title: 'Operations Manager', phone: '0488 825 636', emailLocal: 'zoe' }
  ];

  let currentMemberId = 'robby';
  let previousPersonName = 'Robby Kruyer';
  let previousTitle = '';
  let previousPhone = '';
  let previousEmailLocal = '';

  const ASSETS = 'https://robby-dotcom.github.io/evobuilt-email-signature/logos/';

  function id(value) {
    return document.getElementById(value);
  }

  function getSelectedMode() {
    return document.querySelector('input[name="output-mode"]:checked').value;
  }

  function handlePersonChange() {
    const selected = id('field-person').value;
    const person = TEAM_MEMBERS.find((item) => item.id === selected);
    if (!person) {
      return;
    }

    const nameField = id('field-name');
    const titleField = id('field-title');
    const phoneField = id('field-phone');
    const emailField = id('field-email');

    if (!nameField.value || nameField.value.trim() === previousPersonName) {
      nameField.value = person.label;
    }
    if (!titleField.value || titleField.value.trim() === previousTitle) {
      titleField.value = person.title || '';
    }
    if (!phoneField.value || phoneField.value.trim() === previousPhone) {
      phoneField.value = person.phone || '';
    }
    if (!emailField.value || emailField.value.trim() === previousEmailLocal) {
      emailField.value = person.emailLocal;
    }

    id('field-photo').value = person.photo;
    previousPersonName = person.label;
    previousTitle = titleField.value;
    previousPhone = phoneField.value;
    previousEmailLocal = emailField.value;
    currentMemberId = selected;
    updatePreview();
  }

  function val(fieldId) {
    return id(fieldId).value.trim();
  }

  function buildSignature({ name, title, phone, email, photo, target }) {
    const width = target === 'gmail' ? 520 : 540;
    const rowStyle = target === 'gmail' ? 'border-collapse: collapse; width: 100%;' : 'border-collapse: collapse; width: 100%; table-layout: fixed;';
    const badgeStyles = 'display: block; border: none; outline: none; text-decoration: none;';
    return `<!-- EvoBuilt signature (${target.toUpperCase()}) -->\n<table cellpadding="0" cellspacing="0" border="0" width="${width}" style="font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; width: ${width}px; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">\n  <tr>\n    <td style="padding: 0;">\n      <table cellpadding="0" cellspacing="0" border="0" style="${rowStyle}">\n        <tr>\n          <td style="vertical-align: middle; padding: 9px 14px 9px 9px; width: 177px;">\n            <img src="${photo}" alt="${name}" width="160" height="160" style="display: block; width: 160px; height: 160px; border-radius: 50%; border: 3px solid #b5b5b5; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;" />\n          </td>\n          <td style="vertical-align: top; padding: 9px 9px 9px 0; text-align: center;">\n            <img src="${ASSETS}evobuilt-logo.png" alt="EvoBuilt" width="300" style="display: block; margin: 0 auto 8px; width: 300px; max-width: 300px; height: auto; border: none; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;" />\n            <p style="margin: 0 0 3px 0; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 22px; color: #666666; letter-spacing: 2px; font-weight: normal;">${name}</p>\n            <p style="margin: 0 0 11px 0; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px; color: #999999; letter-spacing: 1px;">${title || 'Project Manager'}</p>\n            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 6px auto;">\n              <tr>\n                <td style="vertical-align: middle; padding-right: 4px; font-size: 12px; color: #00b7c6; font-weight: bold;">P:</td>\n                <td style="vertical-align: middle; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px; color: #999999;"><span style="color: #999999; text-decoration: none; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px;">${phone || '0400 000 000'}</span></td>\n              </tr>\n            </table>\n            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 6px auto;">\n              <tr>\n                <td style="vertical-align: middle; padding-right: 4px; font-size: 12px; color: #00b7c6; font-weight: bold;">E:</td>\n                <td style="vertical-align: middle; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px; color: #999999;"><span style="color: #999999; text-decoration: none; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px;">${email}</span></td>\n              </tr>\n            </table>\n            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 12px auto;">\n              <tr>\n                <td style="vertical-align: middle; padding-right: 4px; font-size: 12px; color: #00b7c6; font-weight: bold;">W:</td>\n                <td style="vertical-align: middle; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px; color: #999999;"><a href="https://www.evobuilt.com.au" style="color: #999999 !important; text-decoration: none !important; font-family: 'PP Telegraf', Arial, Helvetica, sans-serif; font-size: 12px;">www.evobuilt.com.au</a></td>\n              </tr>\n            </table>\n          </td>\n        </tr>\n      </table>\n      <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-top: 5px; border-collapse: collapse;">\n        <tr>\n          <td style="border-top: 2px solid #aaaaaa; padding-top: 6px;"></td>\n        </tr>\n      </table>\n      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; width: 100%;">\n        <tr>\n          <td style="padding: 2px; text-align: center;"><a href="https://au.linkedin.com/" style="text-decoration: none;"><img src="${ASSETS}linkedin.png" alt="LinkedIn" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.instagram.com/evobuilt_/" style="text-decoration: none;"><img src="${ASSETS}instagram.png" alt="Instagram" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.facebook.com/EvoBuiltGroup/" style="text-decoration: none;"><img src="${ASSETS}facebook.png" alt="Facebook" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://open.spotify.com/playlist/1YoC17j5DFK2vWyfk75RBx?si=foR1KjpAT3-1ltK60ZQ8Jw" style="text-decoration: none;"><img src="${ASSETS}spotify.png" alt="Spotify" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.theblock.com.au/" style="text-decoration: none;"><img src="${ASSETS}the-block.png" alt="The Block" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.passivhausassociation.com.au/" style="text-decoration: none;"><img src="${ASSETS}evobuilt-icon.png" alt="Passivhaus Association" width="67" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.mbav.com.au/" style="text-decoration: none;"><img src="${ASSETS}master-builders.png" alt="Master Builders" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.example.com/mbav-award" style="text-decoration: none;"><img src="${ASSETS}mbav-award.png" alt="MBAV Award" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://hia.com.au/" style="text-decoration: none;"><img src="${ASSETS}hia.png" alt="HIA" width="25" height="25" style="${badgeStyles}" /></a></td>\n          <td style="padding: 2px; text-align: center;"><a href="https://www.bpc.vic.gov.au/" style="text-decoration: none;"><img src="${ASSETS}email-icon.png" alt="BPC" width="85" height="25" style="${badgeStyles}" /></a></td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n</table>`;
  }

  function generateHTML(target) {
    const name = val('field-name') || 'Full Name';
    const title = val('field-title') || 'Project Manager';
    const phone = val('field-phone') || '0400 000 000';
    const emailLocal = val('field-email') || 'name';
    const email = `${emailLocal}@evobuilt.com.au`;
    const photo = val('field-photo') || 'https://robby-dotcom.github.io/evobuilt-email-signature/headshots/Robby.jpg';
    let html = buildSignature({ name, title, phone, email, photo, target });
    // For Go High Level we avoid an actual <a> for the website so GHL doesn't force blue styling.
    if (target === 'ghl') {
      html = html.replace(/<a\s+href="https:\/\/www\.evobuilt\.com\.au"[^>]*>\s*www\.evobuilt\.com\.au\s*<\/a>/gi,
        '<span style="color: #999999; text-decoration: none; font-family: \'PP Telegraf\', Arial, Helvetica, sans-serif; font-size: 12px;">www.evobuilt.com.au</span>');
    }
    return html;
  }

  function updatePreview() {
    const mode = getSelectedMode();
    const html = generateHTML(mode);
    id('signature-preview').innerHTML = html;
    id('field-html-output').value = html;
    id('output-type-label').textContent = mode === 'ghl' ? 'Go High Level' : 'Gmail';
  }

  function copyToClipboard(text, button) {
    const blob = new Blob([text], { type: 'text/html' });
    const plainBlob = new Blob([text], { type: 'text/plain' });
    const items = [ new ClipboardItem({ 'text/html': blob, 'text/plain': plainBlob }) ];

    navigator.clipboard.write(items).then(() => {
      button.textContent = 'Copied!';
      button.classList.add('copied');
      setTimeout(() => {
        button.textContent = button.dataset.original;
        button.classList.remove('copied');
      }, 1800);
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      button.textContent = 'Copied!';
      button.classList.add('copied');
      setTimeout(() => {
        button.textContent = button.dataset.original;
        button.classList.remove('copied');
      }, 1800);
    });
  }

  function copyHTML(target, event) {
    const html = generateHTML(target);
    const button = event.target;
    if (!button.dataset.original) {
      button.dataset.original = button.textContent;
    }
    copyToClipboard(html, button);
  }

  document.addEventListener('DOMContentLoaded', () => {
    handlePersonChange();
    updatePreview();
  });
</script>
</body>
</html>
